<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso do Artista — Vox Music Método 90</title><link rel="stylesheet" href="/login.css"></head>
<body><main class="loginShell"><section class="loginCard"><div class="brand">VOX MUSIC</div><p class="tag">MÉTODO 90 • ÁREA DO ARTISTA</p><h1>Bem-vindo à sua jornada.</h1><p class="intro">Entre com seu usuário e senha para acessar as atividades do dia.</p><form id="loginForm"><label>Usuário<input id="usuario" name="usuario" autocomplete="username" required></label><label>Senha<input id="senha" name="senha" type="password" autocomplete="current-password" required></label><p id="erro" class="erro" role="alert"></p><button type="submit">ENTRAR</button></form><p class="help">Seu acesso é individual. Em caso de dúvida, fale com sua equipe.</p></section></main>
<script>
const form=document.getElementById('loginForm');
form.addEventListener('submit',async(e)=>{
 e.preventDefault(); const erro=document.getElementById('erro'); const btn=form.querySelector('button'); erro.textContent=''; btn.disabled=true; btn.textContent='ENTRANDO...';
 try{
  const r=await fetch('/api/login',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('usuario').value.trim(),senha:document.getElementById('senha').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){erro.textContent=j.message||'Não foi possível entrar.';return;}
  const check=await fetch('/api/session',{credentials:'include',cache:'no-store'}); const s=await check.json().catch(()=>({}));
  if(!s.authenticated){erro.textContent='O acesso foi aceito, mas o navegador não manteve a autenticação. Atualize a página e tente novamente.';return;}
  location.assign('/');
 }catch(err){erro.textContent='Não foi possível conectar ao servidor. Tente novamente.';}finally{btn.disabled=false;btn.textContent='ENTRAR';}
});
</script></body></html>
